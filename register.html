<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeLink - Register as a Donor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; background-color: maroon; color: #000000; min-height: 100vh; overflow-x: hidden; }
    .sidebar { width: 260px; background-color: #ffffff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; transition: width 0.3s ease; position: sticky; top: 0; height: 100vh; z-index: 100; }
    .sidebar.collapsed { width: 70px; }
    .sidebar-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e0e0e0; }
    .toggle-btn { background: none; border: 1px solid #000000; font-size: 1.2rem; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
    .nav-list { list-style: none; padding: 10px 0; flex: 1; overflow-y: auto; }
    .nav-item a { display: flex; align-items: center; padding: 14px 20px; color: #000000; text-decoration: none; font-weight: 500; white-space: nowrap; }
    .nav-item a:hover, .nav-item.active a { background-color: maroon; color: white; padding-left: 25px; }
    .nav-icon { margin-right: 15px; font-size: 1.2rem; min-width: 24px; text-align: center; }
    .sidebar.collapsed .nav-text, .sidebar.collapsed .brand-name { display: none; }
    .main-wrapper { flex: 1; display: flex; flex-direction: column; width: calc(100% - 260px); }
    .top-banner { background-color: #ffffff; border-bottom: 2px solid #000000; padding: 20px 40px; text-align: center; }
    .top-banner h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; }
    .content-container { padding: 40px 20px; display: flex; justify-content: center; align-items: center; flex: 1; }
    .card { border: 2px solid #000000; background-color: #FAF0E6; width: 720px; max-width: 90%; padding: 32px; border-radius: 30px; box-shadow: 5px 10px #000000; }
    .card h2 { font-family: Verdana, Geneva, Tahoma, sans-serif; text-align: center; margin-bottom: 24px; font-size: 1.6rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-column { display: flex; flex-direction: column; }
    .field-group { display: flex; flex-direction: column; margin-bottom: 12px; text-align: left; }
    .field-group label { font-weight: bold; font-size: 13px; margin-bottom: 4px; color: #000000; }
    .field-group input, .field-group select, .field-group textarea { background-color: #ffffff; border: 1px solid #000000; padding: 8px 10px; border-radius: 6px; font-size: 13px; width: 100%; outline: none; }
    .field-group textarea { resize: vertical; min-height: 50px; }
    .error-message { color: #d9534f; font-size: 11px; margin-top: 3px; min-height: 14px; }
    .button-wrapper { display: flex; justify-content: center; margin-top: 20px; }
    .btn-submit { background-color: #F3E2D3; font-weight: bold; border: 1.5px solid #000000; color: #000000; border-radius: 8px; padding: 10px 32px; cursor: pointer; font-size: 14px; }
    .btn-submit:hover { background-color: #000000; color: #ffffff; transform: translateY(-2px); }
    .success-message { color: #2b8a3e; font-weight: bold; text-align: center; margin-top: 12px; font-size: 14px; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="brand-name" style="font-weight: 700;">LifeLink</span>
      <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">☰</button>
    </div>
    <ul class="nav-list">
<li class="nav-item"><a href="index.html"><span class="nav-icon">🏠</span><span class="nav-text">Home</span></a></li>
      <li class="nav-item"><a href="about.html"><span class="nav-icon">ℹ️</span><span class="nav-text">About us</span></a></li>
      <li class="nav-item"><a href="login.html"><span class="nav-icon">🔑</span>Donor Login</a></li>
      <li class="nav-item active"><a href="register.html"><span class="nav-icon">✍️</span><span class="nav-text">Register as a Donor</span></a></li>
      <li class="nav-item"><a href="donors.html"><span class="nav-icon">👥</span><span class="nav-text">Donors</span></a></li>
      <li class="nav-item"><a href="bloodbanks.html"><span class="nav-icon">🏥</span><span class="nav-text">Bloodbanks</span></a></li>
      <li class="nav-item"><a href="eb.html"><span class="nav-icon">🚨</span><span class="nav-text">Emergency blood request</span></a></li>
      <li class="nav-item"><a href="contact.html"><span class="nav-icon">📞</span><span class="nav-text">Contact us</span></a></li>
      <li class="nav-item"><a href="reviews.html"><span class="nav-icon">⭐</span><span class="nav-text">Leave a review</span></a></li>
      <li class="nav-item"><a href="ai-bot.html"><span class="nav-icon">🤖</span><span class="nav-text">24/7 Ai bot</span></a></li>    </ul>
  </aside>

  <div class="main-wrapper">
    <header class="top-banner"><h1>LifeLink 🩸</h1></header>
    <main class="content-container">
      <div class="card">
        <h2>DONOR REGISTRATION</h2>
        <form id="donorRegForm" onsubmit="sub(event)">
          <div class="form-grid">
            <div class="form-column">
              <div class="field-group">
                <label for="name">NAME:</label>
                <input type="text" placeholder="Full Name" id="name">
                <span class="error-message" id="nameError"></span>
              </div>
              <div class="field-group">
                <label for="bloodGroup">BLOOD GROUP:</label>
                <select id="bloodGroup">
                  <option value="">Select Blood Group</option>
                  <option value="A+">A+</option><option value="A-">A-</option>
                  <option value="B+">B+</option><option value="B-">B-</option>
                  <option value="O+">O+</option><option value="O-">O-</option>
                  <option value="AB+">AB+</option><option value="AB-">AB-</option>
                </select>
                <span class="error-message" id="bloodGroupError"></span>
              </div>
              <div class="field-group">
                <label for="contact">CONTACT NUMBER:</label>
                <input type="tel" placeholder="+91 98765 43210" id="contact">
                <span class="error-message" id="contactError"></span>
              </div>
              <div class="field-group">
                <label for="location">LOCATION / CITY:</label>
                <input type="text" placeholder="e.g., Koramangala, Bengaluru" id="location">
                <span class="error-message" id="locationError"></span>
              </div>
            </div>

            <div class="form-column">
              <div class="field-group">
                <label for="password">CREATE PASSWORD:</label>
                <input type="password" placeholder="Enter password" id="password">
                <span class="error-message" id="passwordError"></span>
              </div>
              <div class="field-group">
                <label for="confirmPassword">CONFIRM PASSWORD:</label>
                <input type="password" placeholder="Re-enter password" id="confirmPassword">
                <span class="error-message" id="confirmPasswordError"></span>
              </div>
              <div class="field-group">
                <label for="availability">AVAILABILITY STATUS:</label>
                <select id="availability">
                  <option value="Available">Available to Donate</option>
                  <option value="Unavailable">Currently Unavailable</option>
                </select>
              </div>
            </div>
          </div>

          <div class="button-wrapper"><button type="submit" class="btn-submit">Register</button></div>
          <div id="successMessage" class="success-message"></div>
        </form>
      </div>
    </main>
  </div>

  <script>
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

    function sub(event) {
      if (event) event.preventDefault();

      let name = document.querySelector('#name').value.trim();
      let bloodGroup = document.querySelector('#bloodGroup').value;
      let contact = document.querySelector('#contact').value.trim();
      let location = document.querySelector('#location').value.trim();
      let password = document.querySelector('#password').value;
      let confirmPassword = document.querySelector('#confirmPassword').value;
      let availability = document.querySelector('#availability').value;
      let notes = document.querySelector('#notes').value.trim();

      document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
      const successMsg = document.getElementById('successMessage');
      successMsg.textContent = '';

      let isValid = true;
      if (name === '') { document.getElementById('nameError').textContent = 'Name required.'; isValid = false; }
      if (bloodGroup === '') { document.getElementById('bloodGroupError').textContent = 'Select blood group.'; isValid = false; }
      if (contact === '') { document.getElementById('contactError').textContent = 'Contact required.'; isValid = false; }
      if (location === '') { document.getElementById('locationError').textContent = 'Location required.'; isValid = false; }
      if (password === '') { document.getElementById('passwordError').textContent = 'Password required.'; isValid = false; }
      if (password !== confirmPassword) { document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.'; isValid = false; }

      if (isValid) {
        fetch('http://localhost:3000/api/donors', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, bloodGroup, contact, location, password, availability, notes })
        })
        .then(async response => {
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || 'Registration failed');
          return data;
        })
        .then(data => {
          successMsg.textContent = 'Registered Successfully! Redirecting to login...';
          document.getElementById('donorRegForm').reset();
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        })
        .catch(err => {
          alert(err.message || 'Error connecting to server.');
        });
      }
    }
  </script>
</body>
</html>
